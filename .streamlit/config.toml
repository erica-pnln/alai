[theme]
base = "dark"
primaryColor = "#C5A15B"
backgroundColor = "#14251D"
secondaryBackgroundColor = "#213A2C"
textColor = "#F5F0E5"
borderColor = "#47614F"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "Cormorant Garamond:https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap"
baseFontSize = 16
baseFontWeight = 500
headingFontSizes = ["40px", "32px", "25px", "20px", "17px", "15px"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#14251D"
secondaryBackgroundColor = "#213A2C"
textColor = "#F5F0E5"
borderColor = "#47614F"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
